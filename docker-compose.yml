x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: closet_ai
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: closet_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closet_ai -d closet_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      SETUP_SECRET: ${SETUP_SECRET:?SETUP_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JSON_PAYLOAD_LIMIT: ${JSON_PAYLOAD_LIMIT:-1mb}
      AUTH_BOOTSTRAP_RATE_LIMIT_MAX: ${AUTH_BOOTSTRAP_RATE_LIMIT_MAX:-5}
      AUTH_BOOTSTRAP_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_BOOTSTRAP_RATE_LIMIT_WINDOW_SECONDS:-300}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_REFRESH_RATE_LIMIT_MAX: ${AUTH_REFRESH_RATE_LIMIT_MAX:-20}
      AUTH_REFRESH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_REFRESH_RATE_LIMIT_WINDOW_SECONDS:-60}
      OBJECT_STORAGE_ROOT: /data/closet-ai/objects
      GARMENT_IMAGE_MAX_SIZE_MB: ${GARMENT_IMAGE_MAX_SIZE_MB:-8}
      GARMENT_IMAGE_ORPHAN_GRACE_HOURS: ${GARMENT_IMAGE_ORPHAN_GRACE_HOURS:-24}
      GARMENT_IMAGE_CLEANUP_BATCH_SIZE: ${GARMENT_IMAGE_CLEANUP_BATCH_SIZE:-100}
      GARMENT_IMAGE_CLEANUP_CRON: "${GARMENT_IMAGE_CLEANUP_CRON:-0 3 * * *}"
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-https://api.open-meteo.com/v1}
      WEATHER_REQUEST_TIMEOUT_MS: ${WEATHER_REQUEST_TIMEOUT_MS:-5000}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-1200}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      AI_CONTEXT_MODEL: ${AI_CONTEXT_MODEL:?AI_CONTEXT_MODEL is required}
      AI_OUTFIT_MODEL: ${AI_OUTFIT_MODEL:?AI_OUTFIT_MODEL is required}
      AI_VISION_MODEL: ${AI_VISION_MODEL:?AI_VISION_MODEL is required}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-10000}
    expose:
      - "3000"
    volumes:
      - object_storage:/data/closet-ai/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_ROOT: /data/closet-ai/objects
      GARMENT_IMAGE_ORPHAN_GRACE_HOURS: ${GARMENT_IMAGE_ORPHAN_GRACE_HOURS:-24}
      GARMENT_IMAGE_CLEANUP_BATCH_SIZE: ${GARMENT_IMAGE_CLEANUP_BATCH_SIZE:-100}
      GARMENT_IMAGE_CLEANUP_CRON: "${GARMENT_IMAGE_CLEANUP_CRON:-0 3 * * *}"
    volumes:
      - object_storage:/data/closet-ai/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  object_storage:
  caddy_data:
  caddy_config:
